<div class="auth-page">
  <div class="auth-container">
    <div class="auth-row">
      
      <!-- Image Side -->
      <div class="auth-image-panel register-image-panel">
        <div class="auth-image-overlay"></div>
        <img src="assets/login-learning.png" alt="Learning Graphic" class="auth-bg-image">
        <div class="auth-image-text">
          <h2 class="auth-banner-title">Shape your future.</h2>
          <p class="auth-banner-subtitle">Gain access to world-class instructors and interactive courses right at your fingertips.</p>
        </div>
      </div>

      <!-- Form Side -->
      <div class="auth-form-panel register-form-panel">
        <div class="auth-header text-center">
          <h2 class="auth-title">Create an Account</h2>
          <p class="auth-subtitle">Join CourseCart to start learning today.</p>
        </div>
        
        <div *ngIf="errorMessage" class="alert alert-danger auth-error-alert" role="alert">
          <i class="bi bi-exclamation-circle-fill me-2"></i>{{ errorMessage }}
        </div>
        
        <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="auth-form">
          <div class="input-group-custom">
            <label for="name" class="custom-label">Full Name</label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              [(ngModel)]="user.name" 
              required 
              class="form-control custom-input"
              placeholder="Full Name">
          </div>

          <div class="input-group-custom">
            <label for="username" class="custom-label">Username</label>
            <input 
              type="text" 
              id="username" 
              name="username" 
              [(ngModel)]="user.username" 
              required 
              class="form-control custom-input"
              placeholder="Username">
          </div>
          
          <div class="input-group-custom">
            <label for="password" class="custom-label">Password</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              [(ngModel)]="user.password" 
              required 
              class="form-control custom-input"
              placeholder="Password">
          </div>
          
          <button type="submit" class="auth-submit-btn" [disabled]="isLoading || !registerForm.form.valid">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
          </button>
        </form>
        
        <div class="auth-footer text-center">
          Already have an account? <a routerLink="/login" class="auth-link">Log in here</a>
        </div>
      </div>

    </div>
  </div>
</div>
